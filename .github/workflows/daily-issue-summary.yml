name: Daily issue summary

# Tổng kết các issue tạo trong ngày (theo giờ VN) và gửi embed tới Discord.
on:
  schedule:
    - cron: '0 17 * * *' # 17:00 UTC = 00:00 giờ VN (UTC+7), chạy khi ngày VN vừa kết thúc
  workflow_dispatch: # cho phép chạy tay để test

permissions:
  issues: read
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - name: Tổng hợp issue và gửi Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          TZ_VN="Asia/Ho_Chi_Minh"

          # Mốc thời gian của "hôm nay theo giờ VN", quy đổi sang UTC cho GitHub search.
          start=$(TZ="$TZ_VN" date -d "today 00:00" -u +%Y-%m-%dT%H:%M:%S+00:00)
          end=$(TZ="$TZ_VN" date -d "tomorrow 00:00" -u +%Y-%m-%dT%H:%M:%S+00:00)
          today_vn=$(TZ="$TZ_VN" date +%d/%m/%Y)

          echo "Khoảng thời gian (UTC): ${start} -> ${end}"

          gh issue list --state all --limit 1000 \
            --search "created:>=${start} created:<${end}" \
            --json number,title,state,labels,assignees,url > issues.json

          total=$(jq 'length' issues.json)
          opened=$(jq '[.[] | select(.state == "OPEN")] | length' issues.json)
          closed=$(jq '[.[] | select(.state == "CLOSED")] | length' issues.json)

          mapfile -t assignee_lines < <(jq -r '
            [ .[] | if (.assignees | length) == 0 then "chưa gán" else .assignees[].login end ]
            | group_by(.) | map({ k: .[0], n: length }) | sort_by(-.n)
            | .[] | (if .k == "chưa gán" then "chưa gán: \(.n)" else "@\(.k): \(.n)" end)
          ' issues.json)

          mapfile -t priority_lines < <(jq -r '
            [ .[] | ([.labels[].name | select(startswith("priority:")) | sub("^priority:"; "")] | if length == 0 then ["chưa đặt"] else . end)[] ]
            | group_by(.) | map({ k: .[0], n: length })
            | sort_by(if .k == "high" then 1 elif .k == "medium" then 2 elif .k == "low" then 3 elif .k == "chưa đặt" then 9 else 5 end)
            | .[] | "\(.k): \(.n)"
          ' issues.json)

          # Màu embed: xanh nếu đóng hết, vàng nếu còn tồn, đỏ nếu mở nhiều hơn đóng.
          if [ "$total" -eq 0 ]; then
            color=5793266   # 0x5865F2
          elif [ "$closed" -eq "$total" ]; then
            color=5763719   # 0x57F287
          elif [ "$closed" -ge "$opened" ]; then
            color=16705372  # 0xFEE75C
          else
            color=15548997  # 0xED4245
          fi

          # Đóng gói danh sách thành field Discord, tôn trọng giới hạn 1024 ký tự/field:
          # gọn 1 dòng -> nhiều field (tối đa 4) -> cắt bớt kèm "(+N mục khác)".
          # Giới hạn 4 field để tổng embed không vượt 6000 ký tự của Discord.
          pack_fields() {
            local name="$1"; shift
            local -a lines=("$@")
            local n=${#lines[@]}

            if [ "$n" -eq 0 ]; then
              jq -n --arg n "$name" --arg v "—" '[{ name: $n, value: $v, inline: false }]'
              return
            fi

            local compact
            compact=$(printf '%s, ' "${lines[@]}")
            compact="${compact%, }"

            local -a values=()
            local packed=0
            if [ "${#compact}" -le 1000 ]; then
              values=("$compact")
              packed=$n
            else
              local maxparts=4 buf="" cand="" l i=0
              for l in "${lines[@]}"; do
                if [ "${#values[@]}" -ge "$maxparts" ]; then break; fi
                if [ -z "$buf" ]; then cand="$l"; else cand="$buf"$'\n'"$l"; fi
                if [ "${#cand}" -gt 1000 ] && [ -n "$buf" ]; then
                  values+=("$buf"); buf="$l"
                else
                  buf="$cand"
                fi
                i=$((i + 1)); packed=$i
              done
              [ -n "$buf" ] && [ "${#values[@]}" -lt "$maxparts" ] && values+=("$buf")
            fi

            local remaining=$((n - packed))
            if [ "$remaining" -gt 0 ]; then
              local last=$(( ${#values[@]} - 1 ))
              values[$last]="${values[$last]}"$'\n'"(+${remaining} mục khác)"
            fi

            local k=${#values[@]} out='[]' i=1 v fname
            for v in "${values[@]}"; do
              if [ "$k" -eq 1 ]; then fname="$name"; else fname="$name ($i/$k)"; fi
              out=$(jq -c -n --argjson o "$out" --arg nm "$fname" --arg vl "$v" \
                '$o + [{ name: $nm, value: $vl, inline: false }]')
              i=$((i + 1))
            done
            printf '%s' "$out"
          }

          assignee_fields=$(pack_fields "Theo assignee" "${assignee_lines[@]}")
          priority_fields=$(pack_fields "Theo ưu tiên" "${priority_lines[@]}")

          payload=$(jq -n \
            --arg title "📊 Tổng kết issue — ${today_vn}" \
            --arg repo "$REPO" \
            --argjson color "$color" \
            --argjson total "$total" \
            --argjson opened "$opened" \
            --argjson closed "$closed" \
            --argjson af "$assignee_fields" \
            --argjson pf "$priority_fields" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                fields: (
                  [
                    { name: "Tổng số", value: ($total | tostring), inline: true },
                    { name: "Đang mở", value: ($opened | tostring), inline: true },
                    { name: "Đã đóng", value: ($closed | tostring), inline: true }
                  ] + $af + $pf
                ),
                footer: { text: ("GitHub Actions • " + $repo) },
                timestamp: (now | todate)
              }]
            }')

          curl -sS -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK"
